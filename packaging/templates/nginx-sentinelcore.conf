# HTTP: redirect a HTTPS. Il certificato di default e' self-signed
# (generato da install.sh) — pensato per uso interno in LAN. Per esporre
# l'istanza su internet con un dominio reale e un certificato Let's
# Encrypt/certbot valido, vedi packaging/HTTPS.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Esente dal redirect: serve la validazione ACME HTTP-01 di certbot
    # (packaging/HTTPS.md) — deve restare raggiungibile in chiaro su :80.
    location /.well-known/acme-challenge/ {
        root /opt/sentinelsuite/sentinelcore/frontend;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # HTTP/2: con HTTP/1.1 un browser apre al massimo ~6 connessioni per sito e
    # ogni scheda tiene aperto il canale SSE (/api/events). Richiede nginx >= 1.25.1
    # (Debian 13); su versioni precedenti la direttiva non esiste.
    http2 on;

    ssl_certificate     /etc/ssl/sentinelcore/sentinelcore.crt;
    ssl_certificate_key /etc/ssl/sentinelcore/sentinelcore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Notifiche in tempo reale (Server-Sent Events): connessione lunga, mai
    # bufferizzata, altrimenti gli eventi arrivano a blocchi o in ritardo.
    location = /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # File uploads served by the backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Frontend static build (SPA fallback)
    location / {
        root /opt/sentinelsuite/sentinelcore/frontend;
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=3600";
    }
}
